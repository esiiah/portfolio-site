<!-- facility.html  --> 
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Facility Profile — DHIS2 Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style> body{background:#f3f4f6;font-family:Inter,system-ui;} .card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.06)} #facilityMap{height:280px}</style>
</head>
<body>
  <div class="max-w-5xl mx-auto p-6">
    <a href="index.html" class="text-sm underline">&larr; Back to dashboard</a>
    <h1 class="text-2xl font-semibold mt-4">Facility Profile (Demo)</h1>
    <div class="grid grid-cols-3 gap-6 mt-4">
      <div class="col-span-2 card">
        <div class="flex items-center justify-between">
          <div>
            <h2 id="facName" class="text-lg font-semibold">—</h2>
            <div id="facDistrict" class="small-muted">—</div>
          </div>
          <div id="facKPIs" class="text-right">
            <div class="text-sm small-muted">Latest month</div>
            <div id="facCases" class="text-xl font-bold">—</div>
            <div id="facPos" class="small-muted">Positivity: —</div>
          </div>
        </div>

        <div class="mt-4">
          <canvas id="facTimeSeries" style="height:260px"></canvas>
        </div>
      </div>

      <div class="card">
        <div id="facilityMap"></div>
        <div class="mt-3 small-muted">Facility location (demo)</div>
      </div>
    </div>

    <div class="card mt-6">
      <h3 class="font-semibold">Interpretation & Actions</h3>
      <ul class="list-disc list-inside small-muted mt-2">
        <li id="action-1">If positivity spikes -> investigate testing strategy & stockouts.</li>
        <li id="action-2">If reporting completeness < 80% -> follow-up to facility in-charge.</li>
      </ul>
    </div>
  </div>

<script>
async function init() {
  // load demo data and pick first facility (or read query param)
  const res = await fetch('malaria_facility_demo.json'); const data = await res.json();
  const params = new URLSearchParams(location.search); const facility = params.get('id') || data[0].facility_id;
  const rows = data.filter(r=> r.facility_id === facility).sort((a,b)=> a.month.localeCompare(b.month));
  const meta = rows[0];
  document.getElementById('facName').textContent = meta.facility;
  document.getElementById('facDistrict').textContent = meta.district;
  const latest = rows[rows.length-1];
  document.getElementById('facCases').textContent = (latest.positive || 0) + ' cases';
  document.getElementById('facPos').textContent = 'Positivity: ' + ( (latest.positive / (latest.tested||1) * 100).toFixed(1) + '%' );

  // timeseries
  const labels = rows.map(r=>r.month);
  const tested = rows.map(r=>r.tested);
  const positive = rows.map(r=>r.positive);
  new Chart(document.getElementById('facTimeSeries'), {
    type:'line',
    data:{ labels, datasets:[ {label:'Tested', data:tested, borderColor:'#60a5fa', fill:false},{label:'Positive', data:positive, borderColor:'#fb7185', fill:false}] },
    options:{ responsive:true }
  });

  // map
  const map = L.map('facilityMap').setView([meta.lat, meta.lon], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
  L.marker([meta.lat, meta.lon]).addTo(map).bindPopup(meta.facility).openPopup();
}
init();
</script>
</body>
</html>
